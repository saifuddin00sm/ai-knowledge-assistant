services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # Local development credentials for a throwaway container. Override them
      # (and DATABASE_URL / API_DATABASE_URL to match) for anything else.
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      # 55432 by default so the container never collides with a PostgreSQL
      # already installed on the host. Inside the network it is still 5432.
      - "${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    # Every setting comes from .env (optional) or the defaults in
    # app/core/config.py. DATABASE_URL is the one exception: inside the compose
    # network the database is `db`, not localhost.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+asyncpg://rag:rag@db:5432/rag}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # The browser talks to the API directly, so this is the host-visible
        # URL, not the compose-internal one. It is baked into the static bundle
        # at build time - change it and rebuild (`--build`).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${API_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
